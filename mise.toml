[tools]
deno = "2.4.2"
node = "24"
bun = "1"
ast-grep = "0.43.0"
rust = { version = "1.90.0", components="rustfmt,clippy,rust-analyzer" }
ruff = "0.15.14"
uv = "0.9.2"
python = "3.14.3"

[settings]
experimental = true
pin = true

[hooks]
postinstall = "mise run ci:install-deps"

[tasks."ci:install-deps"]
hide = true
description = "Install CI dependencies (only runs on CI)"
run = """
    {% if env.CI and os() == "linux" %}
    sudo apt-get update
    sudo apt-get install -y libwebkit2gtk-4.1-dev
    {% endif %}
    rustup component add rustfmt clippy rust-analyzer
  """

[tasks."npm:install"]
hide = true
description = "Install npm dependencies for the TypeScript client"
dir = "src/clients/typescript"
run = "npm install --no-audit --no-fund"
sources = ["src/clients/typescript/package.json"]
outputs = ["src/clients/typescript/node_modules/.package-lock.json"]

[tasks.sync-versions]
description = "Update all version references"
run = "deno run -A scripts/sync-versions.ts"

## Gen

[tasks."gen:rust"]
description = "Generate JSON schemas from the rust code"
run = "cargo run --bin generate_schemas"
depends_post = ["format:rust"]
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["schemas/*.json"]

[tasks."gen:ts"]
description = "Generate the typescript client"
run = "deno run -A scripts/generate-schema/index.ts --language typescript"
depends = ["gen:rust"]
depends_post = ["format:ts"]
sources = ["schemas/*", "scripts/generate-schema.ts"]
outputs = ["src/clients/typescript/schemas.ts"]

[tasks."gen:python"]
description = "Generate the python client"
run = "deno run -A scripts/generate-schema/index.ts --language python"
depends = ["gen:rust"]
depends_post = ["format:python"]
sources = ["schemas/*", "scripts/generate-schema.ts"]
outputs = ["src/clients/python/src/justbe_webview/schemas/*.py"]

## Debug

[tasks."print-schema"]
description = "Prints a simplified version of the schema"
usage = '''
arg "[schema]" help="The schema to print; prints all if not provided"
'''
run = "deno run -A scripts/generate-schema/debug.ts $usage_schema"

## Publishing

[tasks."verify-publish:ts"]
description = "Verify the typescript client is publishable to JSR"
dir = "src/clients/typescript"
run = "deno publish --dry-run"

[tasks."verify-publish:npm"]
description = "Verify the typescript client is publishable to npm"
dir = "src/clients/typescript"
depends = ["npm:install"]
run = ["npm run build", "npm pack --dry-run"]

[tasks.gen]
description = "Run all code gen tasks"
depends = ["gen:*"]

## Build

[tasks."build:rust"]
description = "Build the webview binary"
run = """
{% set xwin = '' %}
{% set features = '' %}
{% if get_env(name='MISE_ENV', default='') == 'windows' %}
  {% set xwin = ' xwin' %}
{% endif %}
{% if get_env(name='CI', default='') != 'true' %}
  {% set features = ' --features transparent,devtools' %}
{% endif %}
cargo{{xwin}} build --bin webview{{features}}
"""
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/debug/webview"]
depends = ["gen:rust"]

[tasks."build:ts"]
description = "Run code gen for the typescript client and ensure the binary is built"
depends = ["gen:ts", "build:rust"]

[tasks."build:python"]
description = "Run code gen for python and ensure the binary is built"
depends = ["gen:python", "build:rust"]

[tasks.build]
description = "Build all targets"
depends = ["build:*"]

## Format

[tasks."format:rust"]
description = "Format rust code"
run = ["rustfmt src/**/*.rs"]

[tasks."format:ts"]
description = "Format typescript code"
run = ["deno fmt src/clients/typescript"]

[tasks."format:python"]
description = "Format python code"
run = ["ruff format src/clients/python"]

[tasks.format]
alias = "fmt"
description = "Format all code"
depends = ["format:*"]

## Lint

[tasks."lint:rust"]
description = "Run clippy against rust code"
run = ["rustfmt --check src/**/*.rs", "cargo clippy"]

[tasks."lint:ts"]
description = "Run deno lint and typecheck"
dir = "src/clients/typescript"
run = ["deno lint", "deno check ."]

[tasks."lint:ts-npm"]
description = "Typecheck the typescript client against node types"
dir = "src/clients/typescript"
depends = ["npm:install"]
run = ["npm run check"]

[tasks."lint:ast-grep"]
description = "Run ast-grep lint"
run = """
{% set format = '' %}
{% if get_env(name='CI', default='') == 'true' %}
  {% set format = ' --format=github' %}
{% endif %}
sg scan {{format}} .
"""

[tasks."lint"]
description = "Run all linting tasks"
depends = ["lint:*"]

## Example

[tasks."example:python"]
description = "Run a python example"
depends = ["build:python"]
dir = "src/clients/python"
usage = '''
arg "<example>" help="The example to run"
'''
run = "uv run -n examples/$usage_example.py"
env = { LOG_LEVEL = "debug", WEBVIEW_BIN = "../../../target/debug/webview" }

[tasks."example:deno"]
description = "Run a typescript example with Deno"
depends = ["build:ts"]
env = { LOG_LEVEL = "debug", WEBVIEW_BIN = "../../../target/debug/webview" }
usage = '''
arg "<example>" help="The example to run"
'''
run = "deno run -E -R -N --allow-run examples/$usage_example.ts"
dir = "src/clients/typescript"

[tasks."example:node"]
description = "Run a typescript example with Node"
depends = ["build:ts", "npm:install"]
env = { LOG_LEVEL = "debug", WEBVIEW_BIN = "../../../target/debug/webview" }
usage = '''
arg "<example>" help="The example to run"
'''
run = "npx tsx examples/$usage_example.ts"
dir = "src/clients/typescript"

[tasks."example:bun"]
description = "Run a typescript example with Bun"
depends = ["build:ts", "npm:install"]
env = { LOG_LEVEL = "debug", WEBVIEW_BIN = "../../../target/debug/webview" }
usage = '''
arg "<example>" help="The example to run"
'''
run = "bun run examples/$usage_example.ts"
dir = "src/clients/typescript"
